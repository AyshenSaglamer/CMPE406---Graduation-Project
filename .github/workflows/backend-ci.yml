
# DiaMate Backend CI
#
# Runs backend tests on relevant pushes and all pull requests
# targeting the main branch.
#
# Includes unit, web, and database tests against PostgreSQL 17
# using Docker and Testcontainers.
#
# The database schema is built from Database/sql and Flyway.
# AI and Flutter services have their own CI workflows.
#
# The Postman collection is not executed because it requires
# demo accounts and research dataset files.

name: Backend CI

on:
  push:
    branches: [main, backend]
    paths:
      - "backend/**"
      - "Database/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit, web and database tests
        run: mvn -B -ntp test

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
