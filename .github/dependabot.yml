# Dependabot (SECURITY.md S-J): security updates only. open-pull-requests-limit: 0 turns off the routine
# "a newer version exists" PRs (the first run opened 14 of them); a dependency with a known vulnerability still gets a
# PR at once (needs "Dependabot security updates" turned on under Settings > Code security in GitHub), because that
# limit does not apply to security updates. Known vulnerabilities are also caught weekly by dependency-audit.yml.
# To get routine updates back, remove the limit lines (the groups keep minor and patch updates in one PR).
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      ai-service-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /food-vision-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      food-vision-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      flutter-minor-and-patch:
        update-types: [minor, patch]

  # Base images of the Dockerfiles (SECURITY.md S-K).
  - package-ecosystem: docker
    directories: [/backend, /ai-service, /food-vision-service]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  # Images in the compose files (nginx, postgres, flyway, certbot).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
